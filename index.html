<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URLデコーダー</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            min-height: 50px;
            background: #f5f5f5;
            border: 1px solid #ccc;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <h1>URLデコーダー</h1>

    <textarea id="input" placeholder="URLエンコードされた文字列を入力してください"></textarea>

    <br>

    <button id="decodeButton">デコード</button>

    <div id="result"></div>

    <script>
        const input = document.getElementById("input");
        const result = document.getElementById("result");
        const button = document.getElementById("decodeButton");

        button.addEventListener("click", () => {
            try {
                const decoded = decodeURIComponent(input.value);
                result.textContent = decoded;
                result.classList.remove("error");
            } catch (error) {
                result.textContent = "デコードできませんでした。URLエンコードされた文字列を確認してください。";
                result.classList.add("error");
            }
        });
    </script>

</body>
</html>
