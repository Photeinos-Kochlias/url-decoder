<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL エンコーダー / デコーダー</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
            font-size: 16px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.8;
        }

        #encodeButton {
            background: #4caf50;
            color: white;
        }

        #decodeButton {
            background: #2196f3;
            color: white;
        }

        #clearButton {
            background: #777;
            color: white;
        }

        #result {
            margin-top: 20px;
        }

        #resultText {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            box-sizing: border-box;
            background: #f5f5f5;
            border: 1px solid #ccc;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <h1>URL エンコーダー / デコーダー</h1>

    <textarea
        id="input"
        placeholder="ここに文字列またはURLを入力してください"
    ></textarea>

    <div class="buttons">
        <button id="encodeButton">エンコード</button>
        <button id="decodeButton">デコード</button>
        <button id="clearButton">クリア</button>
    </div>

    <div id="result">
        <h2>結果</h2>
        <div id="resultText"></div>
    </div>

    <script>
        const input = document.getElementById("input");
        const resultText = document.getElementById("resultText");

        const encodeButton = document.getElementById("encodeButton");
        const decodeButton = document.getElementById("decodeButton");
        const clearButton = document.getElementById("clearButton");

        // URLエンコード
        encodeButton.addEventListener("click", () => {
            const text = input.value;

            if (!text) {
                resultText.textContent = "";
                return;
            }

            resultText.classList.remove("error");
            resultText.textContent = encodeURIComponent(text);
        });

        // URLデコード
        decodeButton.addEventListener("click", () => {
            const text = input.value;

            if (!text) {
                resultText.textContent = "";
                return;
            }

            try {
                resultText.classList.remove("error");
                resultText.textContent = decodeURIComponent(text);
            } catch (error) {
                resultText.classList.add("error");
                resultText.textContent =
                    "デコードできませんでした。\n" +
                    "入力された文字列が正しいURLエンコード形式か確認してください。";
            }
        });

        // クリア
        clearButton.addEventListener("click", () => {
            input.value = "";
            resultText.textContent = "";
            resultText.classList.remove("error");
        });
    </script>

</body>
</html>
